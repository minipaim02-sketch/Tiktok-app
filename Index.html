<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel TikTok | Mod Menu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: #0b0b0b;
      color: #fff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Tela de Login */
    #login-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .login-box {
      width: 280px;
      padding: 20px;
      background-color: #121212;
      border: 1px solid #222;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .tiktok-logo {
      width: 50px;
      height: 50px;
      background: #000;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid #333;
      margin-bottom: 5px;
    }

    .tiktok-logo svg {
      width: 30px;
      height: 30px;
      fill: #fff;
    }

    .input-field {
      width: 100%;
      padding: 10px;
      background-color: #252525;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .login-btn {
      width: 100%;
      padding: 10px;
      background-color: #e60000;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-btn:active {
      background-color: #b30000;
    }

    .error-msg {
      color: #ff3333;
      font-size: 11px;
      display: none;
      text-align: center;
    }

    /* Ícone Flutuante */
    #floating-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 45px;
      height: 45px;
      background-color: #000;
      border: 2px solid #333;
      border-radius: 50%;
      display: none;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 900;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    #floating-btn svg {
      width: 25px;
      height: 25px;
      fill: #fff;
    }

    /* Painel do Mod Menu */
    #main-panel {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 360px;
      background-color: #121212;
      border-radius: 4px;
      overflow: hidden;
      display: none;
      flex-direction: column;
      box-shadow: 0 8px 20px rgba(0,0,0,0.8);
      border: 1px solid #222;
      z-index: 950;
    }

    .panel-header {
      background-color: #d60000;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
    }

    .panel-controls span {
      margin-left: 8px;
      cursor: pointer;
      padding: 0 4px;
    }

    .panel-controls span:hover {
      opacity: 0.8;
    }

    .panel-body {
      display: flex;
      height: 200px;
      background-color: #121212;
    }

    /* Barra de Navegação Lateral */
    .sidebar {
      width: 45px;
      background-color: #161616;
      border-right: 1px solid #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10px;
      gap: 15px;
    }

    .tab-btn {
      color: #777;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      padding: 5px;
    }

    .tab-btn.active {
      color: #fff;
      border-left: 2px solid #e60000;
    }

    /* Conteúdo das Abas */
    .content-area {
      flex: 1;
      padding: 10px;
      display: flex;
      gap: 10px;
    }

    .tab-content {
      display: none;
      width: 100%;
      gap: 10px;
    }

    .tab-content.active {
      display: flex;
    }

    .column {
      flex: 1;
      background-color: #181818;
      border: 1px solid #282828;
      border-radius: 4px;
      padding: 8px;
    }

    .column-title {
      font-size: 10px;
      color: #ccc;
      margin-bottom: 10px;
      border-bottom: 1px solid #282828;
      padding-bottom: 4px;
    }

    /* Estilo das Opções / Checkboxes */
    .option-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 10px;
      color: #bbb;
      cursor: pointer;
    }

    .option-item input {
      accent-color: #e60000;
      cursor: pointer;
    }

    .info-item {
      font-size: 10px;
      margin-bottom: 8px;
      color: #bbb;
    }

    .info-item span {
      color: #fff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Tela de Login -->
  <div id="login-screen">
    <div class="login-box">
      <div class="tiktok-logo">
        <svg viewBox="0 0 24 24">
          <path d="M19.589 6.686a4.793 4.793 0 0 1-3.77-4.245V2h-3.445v13.672a2.896 2.896 0 1 1-2.896-2.896c.244 0 .482.03.71.088V9.32a6.338 6.338 0 1 0 5.631 6.352V9.123a8.212 8.212 0 0 0 4.77 1.503V7.181a4.8 4.8 0 0 1-1.000-.495z"/>
        </svg>
      </div>
      <input type="text" id="username" class="input-field" placeholder="Nome:">
      <input type="password" id="password" class="input-field" placeholder="Senha:">
      <div id="error-msg" class="error-msg">Usuário ou Senha incorretos!</div>
      <button class="login-btn" onclick="fazerLogin()">Logar</button>
    </div>
  </div>

  <!-- Ícone Flutuante TikTok -->
  <div id="floating-btn" onclick="abrirPainel()">
    <svg viewBox="0 0 24 24">
      <path d="M19.589 6.686a4.793 4.793 0 0 1-3.77-4.245V2h-3.445v13.672a2.896 2.896 0 1 1-2.896-2.896c.244 0 .482.03.71.088V9.32a6.338 6.338 0 1 0 5.631 6.352V9.123a8.212 8.212 0 0 0 4.77 1.503V7.181a4.8 4.8 0 0 1-1.000-.495z"/>
    </svg>
  </div>

  <!-- Painel Flutuante -->
  <div id="main-panel">
    <div class="panel-header">
      <span>PAINEL TIK TOK | FREE FIRE 1.120.x</span>
      <div class="panel-controls">
        <span onclick="minimizarPainel()" title="Minimizar">—</span>
        <span onclick="fecharEExcluir()" title="Fechar e Excluir">X</span>
      </div>
    </div>

    <div class="panel-body">
      <!-- Menu de Abas -->
      <div class="sidebar">
        <div class="tab-btn active" onclick="switchTab(0)">&lt;/&gt;</div>
        <div class="tab-btn" onclick="switchTab(1)">⚙</div>
      </div>

      <!-- Área do Conteúdo -->
      <div class="content-area">
        
        <!-- Aba 1: Funções HeadTrick & Regulator -->
        <div class="tab-content active" id="tab-0">
          <div class="column">
            <div class="column-title">Funções HeadTrick</div>
            <label class="option-item"><input type="checkbox"> Aux Aim</label>
            <label class="option-item"><input type="checkbox"> Aimlock</label>
            <label class="option-item"><input type="checkbox"> Aim Fix</label>
            <label class="option-item"><input type="checkbox"> Head Aim</label>
          </div>
          <div class="column">
            <div class="column-title">Funções Regulator</div>
            <label class="option-item"><input type="checkbox"> Aux Tricker</label>
            <label class="option-item"><input type="checkbox"> Easy Tricker</label>
            <label class="option-item"><input type="checkbox"> Trick Shoter</label>
          </div>
        </div>

        <!-- Aba 2: Informações & Funções Gelo -->
        <div class="tab-content" id="tab-1">
          <div class="column">
            <div class="column-title">Informações</div>
            <div class="info-item">Usuario: <span id="display-user">Ativo!</span></div>
            <div class="info-item">Servidor: <span>Em Execução!</span></div>
            <div class="info-item">Validade: <span>24/03/2026</span></div>
          </div>
          <div class="column">
            <div class="column-title">Funções Gelo</div>
            <label class="option-item"><input type="checkbox" checked> Force Headtrick</label>
            <label class="option-item"><input type="checkbox" checked> Force Sensi</label>
            <label class="option-item"><input type="checkbox" checked> Toques Rapidos</label>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // Validação do Login (Paim / 333)
    function fazerLogin() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('error-msg');

      if (user.toLowerCase() === 'paim' && pass === '333') {
        errorMsg.style.display = 'none';
        document.getElementById('display-user').innerText = 'Ativo!';
        document.getElementById('login-screen').style.display = 'none';
        
        // Exibe botão flutuante e abre o painel
        document.getElementById('floating-btn').style.display = 'flex';
        document.getElementById('main-panel').style.display = 'flex';
      } else {
        errorMsg.style.display = 'block';
      }
    }

    // Abrir o painel ao clicar no círculo flutuante
    function abrirPainel() {
      document.getElementById('main-panel').style.display = 'flex';
    }

    // Botão Menos (-): Oculta apenas o painel, mantendo o círculo flutuante
    function minimizarPainel() {
      document.getElementById('main-panel').style.display = 'none';
    }

    // Botão X: Exclui o painel e fecha o ícone flutuante
    function fecharEExcluir() {
      document.getElementById('main-panel').style.display = 'none';
      document.getElementById('floating-btn').style.display = 'none';
    }

    // Alternar entre as abas
    function switchTab(tabIndex) {
      const tabs = document.querySelectorAll('.tab-btn');
      const contents = document.querySelectorAll('.tab-content');

      tabs.forEach((tab, index) => {
        if (index === tabIndex) {
          tab.classList.add('active');
        } else {
          tab.classList.remove('active');
        }
      });

      contents.forEach((content, index) => {
        if (index === tabIndex) {
          content.classList.add('active');
        } else {
          content.classList.remove('active');
        }
      });
    }
  </script>
</body>
  </html>
